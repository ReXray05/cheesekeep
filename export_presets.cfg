[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="docs/*,tests/*"
export_path="../web/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug="../../work/templates/web_nothreads_debug.zip"
custom_template/release="../../work/templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell=""
html/head_include="<style>body{background:#101a23!important}canvas{image-rendering:pixelated}</style><script>window.addEventListener('contextmenu',e=>{if(e.target.tagName==='CANVAS')e.preventDefault()});</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

